name: Bug report
description: Report a problem with nuvio-mcp
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. This is an unofficial community project, not affiliated with Nuvio.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npx nuvio-mcp --help` is not available; use the package version or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - Streamable HTTP
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: output of `node -v`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server stderr or the tool output. Remove secrets first.
      render: shell
    validations:
      required: false
